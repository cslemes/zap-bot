services:
  app:
    image: ${BOT_IMAGE:-cslemes/zap-bot:latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TRANSCRIPTION_ENDPOINT: ${TRANSCRIPTION_ENDPOINT:?Set TRANSCRIPTION_ENDPOINT}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:?Set TRANSCRIPTION_API_KEY}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:?Set TRANSCRIPTION_MODEL}
      TRANSCRIBE_GROUPS: ${TRANSCRIBE_GROUPS:-true}
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
    volumes:
      - bot_data:/data
volumes:
  bot_data:
